# Load workspace instructions via a hook; installed as /etc/codex/config.toml, Codex's system config layer.
[[hooks.SessionStart]]
matcher = "startup|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 /usr/local/libexec/djinn-agents-chain.py"
additionalContextLimit = 65536

# Refuse tool calls on Djinn's denied paths (DJINN_DENIED_PATHS).
[[hooks.PreToolUse]]
matcher = "Bash|apply_patch|view_image"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /usr/local/libexec/djinn-path-guard.py"
