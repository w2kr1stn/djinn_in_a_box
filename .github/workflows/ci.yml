name: CI

"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install shell-test dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh jq age

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff
        run: uv run ruff check src/ tests/

      - name: Lint shell scripts
        run: |
          shellcheck_files=()
          while IFS= read -r -d '' script; do
            if head -n 1 "$script" | grep -q '^#!.*zsh'; then
              zsh -n "$script"
            else
              shellcheck_files+=("$script")
            fi
          done < <(git ls-files -z '*.sh')
          uvx --from shellcheck-py==0.11.0.1 shellcheck "${shellcheck_files[@]}"

      - name: Run Pyright
        run: uv run pyright src/

      - name: Run tests
        env:
          DJINN_LIVE_DOCKER: "1"
        run: uv run pytest

      - name: Run Bandit
        run: uvx bandit -r src/ --severity-level medium --confidence-level medium

      - name: Audit locked dependencies
        run: |
          ignored=(
            # --ignore-vuln <ID>  # <package>: <reason>; revisit by <YYYY-MM-DD>
          )
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off "${ignored[@]}"

  hostctl:
    name: Hostctl supervisor
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: helper/hostctl

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: helper/hostctl/go.mod
          cache: false

      - name: Run Go tests
        run: go test ./...

      - name: Build static supervisor
        run: CGO_ENABLED=0 go build ./...
